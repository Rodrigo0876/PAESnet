<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Inicio de sesión de PAESnet." />
  <title>Iniciar sesión | PAESnet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-brand-panel">
      <div class="login-brand"><div class="brand-icon">🎓</div><span>PAES<span class="brand-light">net</span></span></div>
      <div class="login-brand-copy">
        <span class="login-kicker">Tu preparación en un solo lugar</span>
        <h1>Prepárate para alcanzar tu meta PAES.</h1>
        <p>Organiza tus ensayos, revisa tus resultados y sigue tu progreso durante tu preparación.</p>
      </div>
      <div class="login-feature-row"><span>📝 Ensayos</span><span>📊 Resultados</span><span>📅 Organización</span></div>
    </section>

    <section class="login-form-panel">
      <div class="login-card">
        <div class="login-mobile-brand"><div class="brand-icon">🎓</div><span>PAES<span class="brand-light">net</span></span></div>
        <span class="login-kicker">Bienvenido</span>
        <h2>Iniciar sesión</h2>
        <p class="login-subtitle">Ingresa tus datos para acceder a PAESnet.</p>
        <form id="loginForm" class="login-form">
          <label><span>Correo electrónico</span><input id="loginEmail" type="email" autocomplete="username" placeholder="correo@ejemplo.cl" required></label>
          <label><span>Contraseña</span><div class="password-field"><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Ingresa tu contraseña" required><button type="button" id="togglePassword">Ver</button></div></label>
          <div class="login-help"><button type="button" id="forgotPassword">¿Olvidaste tu contraseña?</button></div>
          <button class="login-submit" type="submit">Iniciar sesión</button>
          <div id="loginMessage" class="login-message" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
